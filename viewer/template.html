<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ontology Viewer</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1c2330;--mute:#6b7585;--line:#dfe3ea;--ref:#2563eb;--ext:#d97706;--ind:#0f766e;--sel:#e8f0fe;--accent:#2563eb;--warn:#b45309;--chip:#eef1f6}
html[data-theme=dark]{--bg:#12161d;--panel:#1a2029;--ink:#e6eaf0;--mute:#93a0b3;--line:#2b3441;--ref:#60a5fa;--ext:#fbbf24;--ind:#2dd4bf;--sel:#22314a;--accent:#60a5fa;--warn:#fbbf24;--chip:#252d3a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
header{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0;font-weight:650;white-space:nowrap}
#q{flex:1 1 280px;min-width:200px;max-width:520px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
select,button,input[type=text],input[type=search]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
label.chk{display:flex;gap:5px;align-items:center;color:var(--mute);white-space:nowrap}
#app{display:grid;grid-template-columns:150px minmax(0,1fr) 380px;min-height:0}
nav{background:var(--panel);border-right:1px solid var(--line);padding:8px}
nav button{display:block;width:100%;text-align:left;margin-bottom:5px;border:0;background:transparent;padding:8px 10px}
nav button.on{background:var(--sel);font-weight:600;color:var(--accent)}
main{overflow:auto;padding:14px;min-width:0;position:relative}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px}
a.lnk{color:var(--accent);cursor:pointer;text-decoration:none}a.lnk:hover{text-decoration:underline}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.dot.ref{background:var(--ref)}.dot.ext{background:var(--ext)}.dot.ind{background:var(--ind)}
.chip{display:inline-block;background:var(--chip);border-radius:11px;padding:1px 9px;margin:2px 4px 2px 0;font-size:12px}
.chip.ref{color:var(--ref)}.chip.ext{color:var(--ext)}
.mute{color:var(--mute)}.small{font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card b{font-size:22px;display:block}
h2{font-size:15px;margin:18px 0 8px}
.bar{display:grid;grid-template-columns:230px 1fr 50px;gap:8px;align-items:center;margin:3px 0;cursor:pointer}
.bar:hover .fill{filter:brightness(1.15)}
.bar .fill{height:14px;background:var(--ext);border-radius:3px}
.bar.on .fill{outline:2px solid var(--accent)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.rcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ref);border-radius:8px;padding:8px 10px;cursor:pointer}
.rcard:hover{border-color:var(--accent)}
.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.q .item{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.q .item:last-child{border:0}.q .item b{color:var(--warn)}
ul.tree,ul.tree ul{list-style:none;margin:0;padding-left:18px}ul.tree{padding-left:0}
.row{display:flex;align-items:center;gap:2px;padding:2px 4px;border-radius:5px;white-space:nowrap}
.row:hover{background:var(--chip)}.row.sel{background:var(--sel)}
.tw{width:16px;text-align:center;cursor:pointer;color:var(--mute);user-select:none}
.cnt{color:var(--mute);font-size:12px;margin-left:8px}
table{border-collapse:collapse;width:100%;background:var(--panel)}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;font-size:13px}
th{position:sticky;top:-14px;background:var(--panel);cursor:pointer;white-space:nowrap}
tr.hl:hover{background:var(--chip)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
#gwrap{position:absolute;inset:56px 0 0 0;background:var(--panel);border-top:1px solid var(--line)}
#gsvg{width:100%;height:100%;display:block}
.legend{position:absolute;right:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
#results{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.25);max-height:70vh;overflow:auto;width:520px;display:none;padding:6px}
#results .g{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:6px 6px 2px}
#results .r{padding:4px 8px;border-radius:6px;cursor:pointer}#results .r:hover,#results .r.on{background:var(--sel)}
details.docs{position:relative}details.docs>summary{cursor:pointer;list-style:none;border:1px solid var(--line);border-radius:7px;padding:5px 9px;background:var(--bg)}
details.docs .pop{position:absolute;z-index:15;top:32px;left:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;width:340px;max-height:60vh;overflow:auto;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.pop label{display:flex;gap:6px;padding:2px 0;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}.kv div:nth-child(odd){color:var(--mute)}
aside h3{margin:0 0 4px;font-size:17px}aside h4{margin:14px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.cm{border-left:3px solid var(--line);padding-left:8px;margin:6px 0}
.flag{color:var(--warn);font-size:12px}
@media (max-width:1100px){#app{grid-template-columns:120px minmax(0,1fr) 320px}.bar{grid-template-columns:150px 1fr 40px}}
</style>
</head>
<body>
<header>
  <h1>Ontology Viewer</h1>
  <input id="q" type="search" placeholder='Search classes, properties, facts  (kind:class doc:"Head Terms")' autocomplete="off">
  <select id="fkind" title="Show"><option value="both">Reference + extension</option><option value="ref">Reference only</option><option value="ext">Extensions only</option></select>
  <details class="docs" id="fdocs"><summary id="fdocsum">Documents: all</summary><div class="pop" id="fdocpop"></div></details>
  <label class="chk"><input type="checkbox" id="fonly"> only with instances</label>
  <label class="chk"><input type="checkbox" id="fdesc"> hide undescribed</label>
  <button id="theme" title="Light / dark">&#9788;/&#9790;</button>
  <span class="mute small" id="meta"></span>
</header>
<div id="results"></div>
<div id="app">
  <nav id="tabs"></nav>
  <main id="main"></main>
  <aside id="details"><span class="mute">Select a class, property or fact.</span></aside>
</div>
<script>/*__D3__*/</script>
<script>
"use strict";
const DATA = /*__DATA__*/null;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nm = o => o.l || o.id.replace(/^Cl_/, "").replace(/_/g, " ");
const fmt = n => n.toLocaleString("en");

/* ------------------------------------------------------------------ indexes */
const C = {}, P = {}, I = {};
DATA.classes.forEach(c => { C[c.id] = c; c.ch = []; c.ni = 0; c.inds = []; c.docs = c.docs && c.docs.length ? c.docs : (c.ref ? [] : ["(untagged)"]); });
DATA.props.forEach(p => { P[p.id] = p; p.docs = p.docs && p.docs.length ? p.docs : (p.ref ? [] : ["(untagged)"]); });
DATA.inds.forEach(i => { I[i.id] = i; });
DATA.classes.forEach(c => c.p.forEach(p => C[p] && C[p].ch.push(c.id)));
DATA.inds.forEach(i => i.cls.forEach(k => { if (C[k]) { C[k].ni++; C[k].inds.push(i.id); } }));
function totalOf(id, seen = new Set()) { if (seen.has(id)) return 0; seen.add(id); return C[id].ni + C[id].ch.reduce((a, k) => a + totalOf(k, seen), 0); }
DATA.classes.forEach(c => { c.tot = totalOf(c.id); });
const classProps = {};   // class id -> [{p, role}]
DATA.props.forEach(p => { p.dom.forEach(d => (classProps[d] ||= []).push({ p: p.id, role: "domain" })); p.rng.forEach(r => (classProps[r] ||= []).push({ p: p.id, role: "range" })); });
const EDGES = [];        // graph edges between classes
DATA.classes.forEach(c => c.p.forEach(p => EDGES.push({ s: c.id, t: p, k: "sub", l: "subClassOf" })));
DATA.props.filter(p => p.k === "o").forEach(p => p.dom.forEach(d => p.rng.forEach(r => { if (C[d] && C[r]) EDGES.push({ s: d, t: r, k: "prop", l: p.l || p.id, pid: p.id }); })));
const ADJ = {}; EDGES.forEach(e => { (ADJ[e.s] ||= []).push(e); (ADJ[e.t] ||= []).push(e); });
const DOCS = {}; DATA.classes.filter(c => !c.ref).forEach(c => c.docs.forEach(d => DOCS[d] = (DOCS[d] || 0) + 1));
const DOCLIST = Object.entries(DOCS).sort((a, b) => b[1] - a[1]);

/* ------------------------------------------------------------------ state */
const S = { tab: "overview", sel: null, f: { kind: "both", docs: new Set(), only: false, desc: false }, exp: new Set(), treeSort: "size",
  g: { mode: "hood", depth: 1, cap: 120, inds: false }, pp: { q: "", sort: "use", dir: -1, page: 0 }, ff: { q: "", cls: "", doc: "", src: "", page: 0 }, quality: null };
const TABS = [["overview", "Overview"], ["tree", "Class tree"], ["graph", "Graph"], ["props", "Properties"], ["facts", "Facts"]];

function passClass(c) {
  const f = S.f;
  if (f.kind === "ref" && !c.ref) return false;
  if (f.kind === "ext" && c.ref) return false;
  if (f.docs.size && !c.docs.some(d => f.docs.has(d))) return false;
  if (f.only && c.tot === 0) return false;
  if (f.desc && !c.c.length) return false;
  return true;
}
const filtersActive = () => S.f.kind !== "both" || S.f.docs.size || S.f.only || S.f.desc;
function visibleSet() {
  const vis = new Set();
  const up = id => { if (vis.has(id)) return; vis.add(id); C[id].p.forEach(p => C[p] && up(p)); };
  DATA.classes.forEach(c => { if (!filtersActive() || passClass(c)) up(c.id); });
  return vis;
}

/* ------------------------------------------------------------------ selection / links */
function select(type, id, keepTab) {
  S.sel = { type, id };
  renderDetails();
  if (S.tab === "tree" && type === "c") { revealInTree(id); }
  else if (S.tab === "graph" && type === "c") { renderGraph(); }
  else if (!keepTab && S.tab === "overview") { /* stay */ }
  syncHash();
}
document.addEventListener("click", e => {
  const a = e.target.closest("a.lnk"); if (!a) return;
  e.preventDefault(); select(a.dataset.t, a.dataset.id);
});
const link = (t, id, label) => `<a class="lnk" data-t="${t}" data-id="${esc(id)}">${esc(label)}</a>`;
const clink = id => C[id] ? link("c", id, nm(C[id])) : `<span class="mute">${esc(id)}</span>`;
const dotFor = c => `<span class="dot ${c.ref ? "ref" : "ext"}"></span>`;

/* ------------------------------------------------------------------ details panel */
function chips(tags) { return (tags || []).map(([d, l]) => `<span class="chip ext" title="${esc(d)}">${esc(d)}${l ? " &middot; " + esc(l) : ""}</span>`).join(""); }
function renderDetails() {
  const el = $("#details"); const s = S.sel; if (!s) return;
  let h = "";
  if (s.type === "c" && C[s.id]) {
    const c = C[s.id];
    h += `<h3>${dotFor(c)}${esc(nm(c))}</h3><span class="chip ${c.ref ? "ref" : "ext"}">${c.ref ? "reference" : "extension"}</span>`;
    h += `<div class="small mute">:${esc(c.id)} <a class="lnk" onclick="navigator.clipboard&&navigator.clipboard.writeText(':${esc(c.id)}')">copy</a></div>`;
    if (c.alt.length) h += `<h4>Also called</h4>${c.alt.map(a => `<span class="chip">${esc(a)}</span>`).join("")}`;
    h += `<h4>Description</h4>` + (c.c.length ? c.c.map(t => `<div class="cm">${esc(t)}</div>`).join("") : `<span class="flag">no description</span>`);
    if (c.t.length) h += `<h4>Source (${c.t.length})</h4>${chips(c.t.slice(0, 40))}${c.t.length > 40 ? `<span class="mute small"> +${c.t.length - 40} more</span>` : ""}`;
    if (c.enum.length) h += `<h4>Enumeration members</h4>${c.enum.map(m => `<span class="chip">${esc(m)}</span>`).join("")}`;
    h += `<h4>Parents</h4>` + (c.p.length ? c.p.map(clink).join(", ") : `<span class="mute">none</span>`) + (c.flat ? ` <span class="flag">only Thing/Entity</span>` : "");
    h += `<h4>Subclasses (${c.ch.length})</h4>` + (c.ch.slice(0, 40).map(clink).join(", ") || `<span class="mute">none</span>`) + (c.ch.length > 40 ? ` <span class="mute small">+${c.ch.length - 40} more</span>` : "");
    const cp = classProps[c.id] || [];
    if (cp.length) h += `<h4>Properties (${cp.length})</h4>` + cp.slice(0, 40).map(x => { const p = P[x.p]; return `<div class="small">${link("p", p.id, p.l || p.id)} <span class="mute">${x.role}${p.rng.length && x.role === "domain" ? " &rarr; " + esc(p.rng.slice(0, 3).join(", ")) : ""}</span></div>`; }).join("") + (cp.length > 40 ? `<span class="mute small">+${cp.length - 40} more</span>` : "");
    h += `<h4>Instances (${c.ni} direct, ${c.tot} incl. subclasses)</h4>` + (c.inds.slice(0, 30).map(i => link("i", i, nm(I[i]))).join(", ") || `<span class="mute">none</span>`) + (c.inds.length > 30 ? ` <span class="mute small">+${c.inds.length - 30} more</span>` : "");
  } else if (s.type === "p" && P[s.id]) {
    const p = P[s.id];
    h += `<h3>${esc(p.l || p.id)}</h3><span class="chip ${p.ref ? "ref" : "ext"}">${p.ref ? "reference" : "extension"}</span><span class="chip">${p.k === "o" ? "object property" : "datatype property"}</span>`;
    h += `<div class="small mute">:${esc(p.id)} &middot; used in ${fmt(p.use)} triples</div>`;
    h += `<h4>Domain</h4>${p.dom.map(clink).join(", ") || '<span class="mute">unspecified</span>'}`;
    h += `<h4>Range</h4>${p.rng.map(r => C[r] ? clink(r) : `<span class="chip">${esc(r)}</span>`).join(" ") || '<span class="mute">unspecified</span>'}`;
    if (p.c.length) h += `<h4>Description</h4>` + p.c.map(t => `<div class="cm">${esc(t)}</div>`).join("");
    if (p.t.length) h += `<h4>Source</h4>${chips(p.t.slice(0, 30))}`;
  } else if (s.type === "i" && I[s.id]) {
    const i = I[s.id];
    h += `<h3><span class="dot ind"></span>${esc(nm(i))}</h3><div class="small mute">:${esc(i.id)}</div>`;
    h += `<h4>Type</h4>${i.cls.map(clink).join(", ")}`;
    h += `<h4>Source clause</h4>` + (i.src ? `<span class="chip ext">${esc(i.src)}</span>` : `<span class="flag">no :sourceClause</span>`);
    h += `<h4>Values (${i.nv})</h4><div class="kv">${i.v.map(([p, v, o]) => `<div>${esc(p)}</div><div>${o ? (I[v] ? link("i", v, nm(I[v])) : C[v] ? clink(v) : esc(v)) : esc(v)}</div>`).join("")}</div>`;
    if (i.c.length) h += `<h4>Notes</h4>${i.c.map(t => `<div class="cm">${esc(t)}</div>`).join("")}`;
  } else h = '<span class="mute">Not found.</span>';
  el.innerHTML = h; el.scrollTop = 0;
}

/* ------------------------------------------------------------------ overview */
function renderOverview() {
  const m = DATA.meta, q = DATA.quality;
  const extC = m.classes - m.refClasses, refP = DATA.props.filter(p => p.ref).length;
  const withSrc = DATA.inds.filter(i => i.src).length;
  let h = `<div class="cards">
   <div class="card"><b>${fmt(m.classes)}</b>classes<div class="small mute">${m.refClasses} reference &middot; ${fmt(extC)} extensions</div></div>
   <div class="card"><b>${fmt(m.props)}</b>properties<div class="small mute">${refP} reference &middot; ${fmt(m.props - refP)} extensions</div></div>
   <div class="card"><b>${fmt(m.inds)}</b>facts (individuals)<div class="small mute">${fmt(withSrc)} with source clause</div></div>
   <div class="card"><b>${fmt(m.triples)}</b>triples<div class="small mute">${esc(m.file)}</div></div></div>`;
  h += `<h2>Extension classes per source document <span class="mute small">(click to filter everything)</span></h2>`;
  const max = DOCLIST.length ? DOCLIST[0][1] : 1;
  h += DOCLIST.slice(0, 40).map(([d, n]) => `<div class="bar ${S.f.docs.has(d) ? "on" : ""}" data-doc="${esc(d)}"><span>${esc(d)}</span><span><div class="fill" style="width:${Math.max(2, 100 * n / max)}%"></div></span><span class="mute">${fmt(n)}</span></div>`).join("");
  if (DOCLIST.length > 40) h += `<div class="mute small">+${DOCLIST.length - 40} more documents (see the Documents filter)</div>`;
  h += `<h2>Reference classes</h2><div class="rgrid">`;
  const refs = DATA.classes.filter(c => c.ref && !c.enum.length).sort((a, b) => b.tot - a.tot || a.id.localeCompare(b.id));
  const subExt = id => { const seen = new Set(), st = [id]; let n = 0; while (st.length) { const u = st.pop(); C[u].ch.forEach(k => { if (!seen.has(k)) { seen.add(k); if (!C[k].ref) n++; st.push(k); } }); } return n; };
  h += refs.map(c => `<div class="rcard" data-c="${esc(c.id)}"><b>${esc(nm(c))}</b><div class="small mute">${fmt(c.tot)} instances &middot; ${fmt(subExt(c.id))} ext. subclasses &middot; ${(classProps[c.id] || []).filter(x => !P[x.p].ref).length} ext. properties</div></div>`).join("") + `</div>`;
  h += `<h2>Data quality <span class="mute small">(issues worth cleaning up)</span></h2><div class="q">`;
  const items = [["dups", "Near-duplicate class names (same name apart from Cl_ prefix, case, plural)", q.dups.length], ["flat", "Classes whose only parent is Thing / Entity", q.flat.length], ["noInst", "Classes with no instances", q.noInst.length], ["noDesc", "Classes without a description", q.noDesc.length], ["noSource", "Facts without :sourceClause", q.noSource.length], ["badDates", "Facts with invalid xsd:date values", q.badDates.length]];
  h += items.map(([k, t, n]) => `<div class="item" data-q="${k}"><span>${t}</span><b>${fmt(n)}</b></div>`).join("") + `</div><div id="qlist"></div>`;
  $("#main").innerHTML = h;
  $("#main").querySelectorAll(".bar").forEach(b => b.onclick = () => { const d = b.dataset.doc; S.f.docs.has(d) ? S.f.docs.delete(d) : S.f.docs.add(d); syncDocFilter(); renderMain(); });
  $("#main").querySelectorAll(".rcard").forEach(b => b.onclick = () => select("c", b.dataset.c));
  $("#main").querySelectorAll(".item").forEach(b => b.onclick = () => { S.quality = b.dataset.q; showQuality(); });
  if (S.quality) showQuality();
}
function showQuality() {
  const k = S.quality, q = DATA.quality, el = $("#qlist"); if (!el || !k) return;
  const v = q[k]; let h = `<h2>${fmt(v.length)} items</h2><div class="small">`;
  if (k === "dups") h += v.slice(0, 300).map(g => `<div>${g.map(id => clink(id)).join(" &nbsp;/&nbsp; ")}</div>`).join("");
  else if (k === "noSource" || k === "badDates") h += v.slice(0, 300).map(id => `<span>${link("i", id, id)}</span>`).join(" &middot; ");
  else h += v.slice(0, 400).map(id => `<span>${clink(id)}</span>`).join(" &middot; ");
  if (v.length > 300) h += `<div class="mute">showing the first ${k === "noInst" || k === "flat" || k === "noDesc" ? 400 : 300}</div>`;
  el.innerHTML = h + "</div>";
}

/* ------------------------------------------------------------------ class tree */
let VIS = null;
function renderTree() {
  VIS = visibleSet();
  $("#main").innerHTML = `<div class="toolbar"><button id="expall">Expand all</button><button id="colall">Collapse all</button>
   <label>Sort <select id="tsort"><option value="name">name</option><option value="size">instances</option></select></label>
   <span class="mute small">${VIS.size} classes shown &middot; <span class="dot ref"></span>reference <span class="dot ext"></span>extension</span></div><ul class="tree" id="tree"></ul>`;
  $("#tsort").value = S.treeSort; $("#tsort").onchange = e => { S.treeSort = e.target.value; renderTree(); };
  $("#expall").onclick = () => { VIS.forEach(id => C[id].ch.length && S.exp.add(id)); renderTree(); };
  $("#colall").onclick = () => { S.exp.clear(); renderTree(); };
  const cmp = S.treeSort === "size" ? (a, b) => C[b].ref - C[a].ref || C[b].tot - C[a].tot || a.localeCompare(b) : (a, b) => C[b].ref - C[a].ref || nm(C[a]).toLowerCase().localeCompare(nm(C[b]).toLowerCase());
  const roots = DATA.classes.filter(c => !c.p.length && VIS.has(c.id)).map(c => c.id).sort(cmp);
  const frag = document.createDocumentFragment(); roots.forEach(r => frag.appendChild(treeNode(r, new Set(), cmp)));
  $("#tree").appendChild(frag);
}
function treeNode(id, path, cmp) {
  const c = C[id], li = document.createElement("li");
  const kids = c.ch.filter(k => VIS.has(k) && !path.has(k)).sort(cmp);

    <select id="fd"><option value="">all documents</option>${docs.map(d => `<option ${d === f.doc ? "selected" : ""}>${esc(d)}</option>`).join("")}</select>
    <select id="fs"><option value="">any source</option><option value="has" ${f.src === "has" ? "selected" : ""}>has :sourceClause</option><option value="no" ${f.src === "no" ? "selected" : ""}>no source</option></select>
    <button id="fcsv">Export CSV</button><span class="mute small">${fmt(rows.length)} facts</span>
    <button id="fprev">&lsaquo;</button><span class="small">page ${f.page + 1} / ${pages}</span><button id="fnext">&rsaquo;</button></div>
    <table><thead><tr><th>Fact</th><th>Class</th><th>Values</th><th>Source clause</th></tr></thead><tbody>
    ${rows.slice(f.page * per, f.page * per + per).map(i => `<tr class="hl"><td>${link("i", i.id, nm(i))}</td><td>${i.cls.slice(0, 2).map(clink).join(", ")}</td>
    <td class="small">${esc(i.v.filter(x => !x[2]).slice(0, 4).map(x => x[0] + "=" + x[1].slice(0, 50)).join("; "))}</td><td class="small">${i.src ? esc(i.src) : '<span class="flag">none</span>'}</td></tr>`).join("")}</tbody></table>`;
  const redo = (id, key, pos) => { renderFacts(); const el = $("#" + id); if (el) { el.focus(); if (pos != null) el.setSelectionRange(pos, pos); } };
  $("#fq").oninput = e => { f.q = e.target.value; f.page = 0; redo("fq", 0, e.target.selectionStart); };
  $("#fc").oninput = e => { f.cls = e.target.value; f.page = 0; redo("fc", 0, e.target.selectionStart); };
  $("#fd").onchange = e => { f.doc = e.target.value; f.page = 0; renderFacts(); }; $("#fs").onchange = e => { f.src = e.target.value; f.page = 0; renderFacts(); };
  $("#fprev").onclick = () => { f.page = Math.max(0, f.page - 1); renderFacts(); }; $("#fnext").onclick = () => { f.page = Math.min(pages - 1, f.page + 1); renderFacts(); };
  $("#fcsv").onclick = () => {
    const q = s => '"' + String(s ?? "").replace(/"/g, '""') + '"';
    download("facts.csv", "id,label,class,values,source_clause,document\n" + factRows().map(i => [i.id, nm(i), i.cls.join("|"), i.v.map(x => x[0] + "=" + x[1]).join("; "), i.src, i.doc].map(q).join(",")).join("\n"), "text/csv");
  };
}

/* ------------------------------------------------------------------ search */
let resIdx = -1;
function parseQuery(raw) {
  const o = { kind: "", doc: "", text: raw };
  o.text = raw.replace(/kind:(\w+)/i, (_, k) => { o.kind = k.toLowerCase(); return ""; }).replace(/doc:"([^"]+)"|doc:(\S+)/i, (_, a, b) => { o.doc = (a || b).toLowerCase(); return ""; }).trim().toLowerCase();
  return o;
}
function doSearch() {
  const raw = $("#q").value, res = $("#results");
  if (!raw.trim()) { res.style.display = "none"; return; }
  const o = parseQuery(raw), hit = [];
  const match = (...f) => !o.text || f.join(" ").toLowerCase().includes(o.text);
  const docOk = d => !o.doc || d.some(x => x.toLowerCase().includes(o.doc));
  const groups = [];
  if (!o.kind || o.kind.startsWith("c")) groups.push(["Classes", DATA.classes.filter(c => match(c.id, c.l, c.alt.join(" "), c.c.join(" ")) && docOk(c.docs)).sort((a, b) => (b.ref - a.ref) || (nm(a).toLowerCase().startsWith(o.text) ? 0 : 1) - (nm(b).toLowerCase().startsWith(o.text) ? 0 : 1) || b.tot - a.tot).slice(0, 12).map(c => ({ t: "c", id: c.id, label: nm(c), sub: c.ref ? "reference" : "extension", ref: c.ref }))]);
  if (!o.kind || o.kind.startsWith("p")) groups.push(["Properties", DATA.props.filter(p => match(p.id, p.l, p.c.join(" ")) && docOk(p.docs)).slice(0, 8).map(p => ({ t: "p", id: p.id, label: nm(p), sub: p.k === "o" ? "object property" : "data property", ref: p.ref }))]);
  if (!o.kind || o.kind.startsWith("i") || o.kind.startsWith("f")) groups.push(["Facts", DATA.inds.filter(i => match(i.id, i.l, i.src) && (!o.doc || i.doc.toLowerCase().includes(o.doc))).slice(0, 8).map(i => ({ t: "i", id: i.id, label: nm(i), sub: i.cls[0] || "", ref: -1 }))]);
  let h = ""; resIdx = -1;
  groups.forEach(([t, arr]) => { if (arr.length) { h += `<div class="g">${t}</div>` + arr.map(r => `<div class="r" data-t="${r.t}" data-id="${esc(r.id)}"><span class="dot ${r.ref === -1 ? "ind" : r.ref ? "ref" : "ext"}"></span>${esc(r.label)} <span class="mute small">${esc(r.sub)}</span></div>`).join(""); } });
  res.innerHTML = h || '<div class="r mute">No matches</div>'; res.style.display = "block";
  const b = $("#q").getBoundingClientRect(); res.style.left = b.left + "px"; res.style.top = (b.bottom + 4) + "px";
}
$("#q").addEventListener("input", doSearch);
$("#q").addEventListener("keydown", e => {
  const rs = [...document.querySelectorAll("#results .r[data-id]")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); resIdx = (resIdx + (e.key === "ArrowDown" ? 1 : -1) + rs.length) % rs.length; rs.forEach((r, i) => r.classList.toggle("on", i === resIdx)); }
  else if (e.key === "Enter" && rs.length) { const r = rs[resIdx >= 0 ? resIdx : 0]; pick(r); }
  else if (e.key === "Escape") $("#results").style.display = "none";
});
$("#results").addEventListener("click", e => { const r = e.target.closest(".r[data-id]"); if (r) pick(r); });
function pick(r) {
  $("#results").style.display = "none";
  if (r.dataset.t === "i") { setTab("facts", true); } else if (r.dataset.t === "p") { setTab("props", true); }
  select(r.dataset.t, r.dataset.id);
  if (r.dataset.t === "c" && S.tab !== "tree" && S.tab !== "graph") { /* details panel shows it */ }
}
document.addEventListener("click", e => { if (!e.target.closest("#results") && e.target !== $("#q")) $("#results").style.display = "none"; });

/* ------------------------------------------------------------------ filters, tabs, theme, hash */
function syncDocFilter() {
  const n = S.f.docs.size; $("#fdocsum").textContent = n ? `Documents: ${n} selected` : "Documents: all";
  $("#fdocpop").querySelectorAll("input").forEach(i => i.checked = S.f.docs.has(i.value));
}
$("#fdocpop").innerHTML = `<div class="small mute" style="margin-bottom:4px">Documents that added extension classes (counts)</div>` + DOCLIST.map(([d, n]) => `<label><input type="checkbox" value="${esc(d)}"> ${esc(d)} <span class="mute">(${fmt(n)})</span></label>`).join("");
$("#fdocpop").addEventListener("change", e => { e.target.checked ? S.f.docs.add(e.target.value) : S.f.docs.delete(e.target.value); syncDocFilter(); renderMain(); });
$("#fkind").onchange = e => { S.f.kind = e.target.value; renderMain(); };
$("#fonly").onchange = e => { S.f.only = e.target.checked; renderMain(); };
$("#fdesc").onchange = e => { S.f.desc = e.target.checked; renderMain(); };
document.addEventListener("click", e => { const d = $("#fdocs"); if (d.open && !d.contains(e.target)) d.open = false; });
$("#theme").onclick = () => { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = t; try { localStorage.setItem("ovTheme", t); } catch (e) { } if (S.tab === "graph") renderGraph(); };
try { const t = localStorage.getItem("ovTheme"); if (t) document.documentElement.dataset.theme = t; else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark"; } catch (e) { }

function renderTabs() { $("#tabs").innerHTML = TABS.map(([k, t]) => `<button data-tab="${k}" class="${S.tab === k ? "on" : ""}">${t}</button>`).join(""); $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => setTab(b.dataset.tab)); }
function setTab(t, quiet) { S.tab = t; renderTabs(); if (!quiet) renderMain(); else renderMain(); syncHash(); }
function renderMain() { ({ overview: renderOverview, tree: renderTree, graph: renderGraph, props: renderProps, facts: renderFacts })[S.tab](); }
function syncHash() { try { history.replaceState(null, "", "#tab=" + S.tab + (S.sel ? "&sel=" + S.sel.type + ":" + encodeURIComponent(S.sel.id) : "")); } catch (e) { } }
function readHash() {
  const m = Object.fromEntries(location.hash.slice(1).split("&").filter(Boolean).map(x => x.split("=")));
  if (m.tab && TABS.some(t => t[0] === m.tab)) S.tab = m.tab;
  if (m.sel) { const [t, ...r] = decodeURIComponent(m.sel).split(":"); const id = r.join(":"); if ((t === "c" && C[id]) || (t === "p" && P[id]) || (t === "i" && I[id])) S.sel = { type: t, id }; }
  if (m.mode) S.g.mode = m.mode;
}

$("#meta").textContent = `${DATA.meta.file} · ${fmt(DATA.meta.triples)} triples` + (DATA.meta.built ? ` · built ${DATA.meta.built}` : "");
readHash(); renderTabs(); renderMain(); if (S.sel) renderDetails();
window.addEventListener("hashchange", () => { readHash(); renderTabs(); renderMain(); if (S.sel) renderDetails(); });
</script>
</body>
